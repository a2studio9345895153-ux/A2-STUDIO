<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A2 Studio | Wedding Photography & Films</title>

    <meta name="description"
          content="A2 Studio - Wedding Photography, Videography, Engagement and Pre-Wedding Photography in Mandapam.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: white;
            line-height: 1.6;
        }

        /* NAVBAR */

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo span {
            color: #d4af37;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;

            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
                radial-gradient(circle at center, #333, #050505 70%);
        }

        .hero-content {
            max-width: 900px;
        }

        .hero h1 {
            font-size: clamp(55px, 10vw, 110px);
            letter-spacing: 10px;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: #d4af37;
        }

        .hero h2 {
            font-size: clamp(18px, 3vw, 30px);
            font-weight: normal;
            margin-bottom: 20px;
        }

        .hero p {
            color: #ccc;
            max-width: 650px;
            margin: auto;
            font-size: 17px;
        }

        .buttons {
            margin-top: 35px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            margin: 7px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .gold-btn {
            background: #d4af37;
            color: #000;
        }

        .outline-btn {
            border: 1px solid #d4af37;
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        /* SECTION */

        section {
            padding: 90px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 40px;
        }

        .section-title span {
            color: #d4af37;
        }

        .section-title p {
            color: #999;
            margin-top: 10px;
        }

        /* SERVICES */

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            padding: 35px 25px;
            text-align: center;
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #d4af37;
        }

        .card h3 {
            margin: 15px 0 10px;
        }

        .card p {
            color: #999;
            font-size: 14px;
        }

        .icon {
            font-size: 42px;
        }

        /* ABOUT */

        .about {
            max-width: 900px;
            margin: auto;
            text-align: center;
